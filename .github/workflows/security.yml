name: Security tests

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history so the secret scan covers past commits

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on high/critical advisories in the full tree. Registry-backed audits can lag
      # behind vendor advisories (the August 2026 Next.js critical was absent from the GitHub
      # Advisory Database for over a week), so also watch the Next.js security release notes.
      - run: pnpm audit --audit-level=high

  # Deployment-drift prevention: fail when the deployed production database is
  # behind the migration state that the repository requires. On PRs the
  # comparison uses the merge-base state (so a PR introducing new migrations is
  # not self-blocking); after merge, main's own run enforces the new state,
  # blocking further merges until production is migrated. The project ref is
  # public (it is part of NEXT_PUBLIC_SUPABASE_URL); access is via the
  # Management API token stored as the SUPABASE_ACCESS_TOKEN secret.
  deployment-migration-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Required migration version (merge-base for PRs, HEAD for pushes)
        id: required
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch origin main --quiet
            base=$(git merge-base origin/main HEAD)
            ver=$(git ls-tree --name-only "$base" supabase/migrations | grep -E '[0-9]{14}' | sort | tail -1 | grep -oE '^[0-9]{14}')
          else
            ver=$(ls supabase/migrations | grep -E '^[0-9]{14}' | sort | tail -1)
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Deployed production migration version
        id: prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret is not set - drift check skipped. Add it (Management API token) to enforce production migration sync."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Response shapes (verified against the live API and the official
          # OpenAPI spec): success is HTTP 201 with a JSON row ARRAY
          # ([{"version": ...}]); failures are JSON error OBJECTS
          # (e.g. {"message":"JWT could not be decoded"}) with 4xx/5xx codes.
          # Parse by HTTP status first, capture the body to a temp file, and
          # never echo it: error bodies are attacker-influenceable noise and
          # must not leak into annotations or logs.
          http_code=$(curl -sS -o "$RUNNER_TEMP/prod_version.json" -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/vbtwythnuhayqrswiojy/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"select max(version) as version from supabase_migrations.schema_migrations"}') || {
            echo "::error::Production migration state unreadable: Management API request failed."
            exit 1
          }

          ver=""
          if [ "$http_code" = "201" ]; then
            ver=$(jq -re '
              if type == "array" then (.[0].version // empty)
              elif type == "object" then (.version // .rows[0].version // empty)
              else empty end
            ' "$RUNNER_TEMP/prod_version.json" 2>/dev/null || true)
          fi

          rm -f "$RUNNER_TEMP/prod_version.json"

          if [ -z "$ver" ]; then
            echo "::error::Production migration state unreadable: Management API returned HTTP ${http_code} with an unparseable or error response."
            exit 1
          fi

          if ! [[ "$ver" =~ ^[0-9]{14}$ ]]; then
            echo "::error::Production migration state unreadable: unexpected version format (HTTP ${http_code})."
            exit 1
          fi

          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Fail if production is behind the repository
        env:
          REQUIRED: ${{ steps.required.outputs.version }}
          DEPLOYED: ${{ steps.prod.outputs.version }}
          AVAILABLE: ${{ steps.prod.outputs.available }}
        run: |
          echo "required: $REQUIRED  deployed (production): $DEPLOYED"
          if [ "$AVAILABLE" != "true" ]; then
            echo "Drift enforcement inactive until SUPABASE_ACCESS_TOKEN secret is configured."
            exit 0
          fi
          if [ -z "$DEPLOYED" ]; then
            echo "::error::Production migration state unreadable (check SUPABASE_ACCESS_TOKEN secret)."
            exit 1
          fi
          if [[ "$DEPLOYED" < "$REQUIRED" ]]; then
            echo "::error::Production Supabase (vbtwythnuhayqrswiojy) is behind the required migration state ($DEPLOYED < $REQUIRED). Apply the pending migrations to production before merging."
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}